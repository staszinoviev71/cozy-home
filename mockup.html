<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уютный Дом — Liquid Glass & Animated Alter-Ego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF5E62;
      --primary-glow: rgba(255, 94, 98, 0.45);
      --accent-cyan: #00F2FE;
      --accent-purple: #9B51E0;
      --accent-amber: #FF9900;
      
      /* Liquid Glass tokens */
      --glass-bg: rgba(255, 255, 255, 0.22);
      --glass-bg-subtle: rgba(255, 255, 255, 0.12);
      --glass-bg-solid: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.45);
      --glass-border-light: rgba(255, 255, 255, 0.65);
      --glass-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.3) inset;
      --glass-blur: blur(28px) saturate(190%);
      
      --text-dark: #16181D;
      --text-soft: #4E525E;
      --text-muted: #8E93A3;
      --phone-radius: 48px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0B0E17;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Жидкие фоновые световые пятна (Liquid Mesh / Aura) */
    .ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.6;
      animation: floatBlob 16s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #FF5E62 0%, #FF9966 60%);
      top: -150px;
      left: -100px;
    }

    .blob-2 {
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, #7F00FF 0%, #E100FF 60%);
      bottom: -200px;
      right: -100px;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #00F2FE 0%, #4FACFE 60%);
      top: 40%;
      left: 40%;
      transform: translate(-50%, -50%);
      animation-delay: -11s;
      opacity: 0.35;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(60px, 40px) scale(1.12) rotate(40deg); }
      100% { transform: translate(-40px, 80px) scale(0.95) rotate(-20deg); }
    }

    /* Стеклянная верхняя панель управления */
    header {
      background: rgba(18, 22, 34, 0.65);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon-glass {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.08));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 24px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .brand-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .liquid-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #FF6B8B, #FF8E53);
      padding: 3px 10px;
      border-radius: 20px;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.4);
    }

    .brand-title p {
      font-size: 12px;
      color: #A0A5B5;
    }

    /* Навигационные табы */
    .screen-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      padding: 4px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      gap: 4px;
      overflow-x: auto;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #B5B9C8;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.06);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    /* Основная область */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 36px 24px 60px;
      gap: 44px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* Смартфон Samsung Galaxy A54 */
    .phone-container {
      position: sticky;
      top: 94px;
      flex-shrink: 0;
    }

    .phone-mockup {
      width: 385px;
      height: 790px;
      background: #090B10;
      border-radius: var(--phone-radius);
      padding: 10px;
      box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.15) inset, 0 0 50px rgba(255, 94, 98, 0.18);
      position: relative;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: #0F131D;
      border-radius: calc(var(--phone-radius) - 8px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Вырез камеры и статусбар */
    .status-bar {
      height: 38px;
      padding: 10px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
      z-index: 20;
    }

    .camera-punch {
      width: 12px;
      height: 12px;
      background: #000;
      border-radius: 50%;
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15);
      z-index: 30;
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 74px;
      position: relative;
    }

    .screen-content::-webkit-scrollbar {
      display: none;
    }

    /* Стеклянный Liquid Glass Bottom Nav */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(18, 24, 38, 0.72);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 12px;
      z-index: 25;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      color: #7B8196;
      font-size: 10.5px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .nav-item .icon {
      font-size: 20px;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-pill {
      width: 110px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 30;
    }

    /* Liquid Glass Push Notification */
    .push-toast {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border-radius: 24px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 45px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);
      z-index: 99;
      display: none;
      color: #1A1A1E;
      animation: slideDownGlass 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownGlass {
      from { transform: translateY(-90px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .push-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .push-app-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .push-body {
      font-size: 13.5px;
      font-weight: 700;
      color: #1A1A1E;
      line-height: 1.35;
    }

    .push-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .push-btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .push-btn.primary {
      background: linear-gradient(135deg, #FF5E62, #FF8E53);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 94, 98, 0.35);
    }

    .push-btn.secondary {
      background: rgba(0,0,0,0.06);
      color: #333;
    }

    /* Сайдбар описания справа */
    .details-panel {
      flex: 1;
      max-width: 680px;
      background: rgba(18, 23, 37, 0.65);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 38px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .details-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(255, 94, 98, 0.2), rgba(255, 142, 83, 0.2));
      border: 1px solid rgba(255, 94, 98, 0.4);
      color: #FFA39E;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .details-panel h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #FFFFFF;
      line-height: 1.25;
    }

    .details-panel p.lead {
      font-size: 15px;
      color: #B5B9C8;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .feature-card-glass {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      transition: all 0.2s;
    }

    .feature-card-glass:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .feature-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .feature-icon-glass {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .feature-card-glass h3 {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .feature-card-glass p {
      font-size: 13.5px;
      color: #9EA3B5;
      line-height: 1.55;
    }

    .status-picker-preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0 24px;
    }

    .status-preview-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-preview-pill:hover, .status-preview-pill.active {
      background: rgba(255, 94, 98, 0.15);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .status-preview-pill .icon {
      font-size: 26px;
      margin-bottom: 4px;
      display: block;
    }

    .status-preview-pill .name {
      font-size: 11px;
      font-weight: 700;
      color: #E2E4EC;
    }

    /* ===================================================
       АНИМИРОВАННЫЙ МУЛЬТЯШНЫЙ АВАТАР (SVG CHARACTER)
       =================================================== */

    .avatar-wrapper {
      position: relative;
      width: 82px;
      height: 82px;
      border-radius: 26px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2), 0 0 20px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: visible;
    }

    /* Интерактивные SVG-эмоции персонажа */
    .character-svg {
      width: 64px;
      height: 64px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Анимации персонажа */
    @keyframes breatheBody {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.02, 0.98); }
    }

    @keyframes happyBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-7px) rotate(-3deg); }
      75% { transform: translateY(-3px) rotate(3deg); }
    }

    @keyframes tiredSway {
      0%, 100% { transform: rotate(-3deg) translateY(2px); }
      50% { transform: rotate(3deg) translateY(4px); }
    }

    @keyframes hungryDream {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.04) translateY(-2px); }
    }

    @keyframes sadDroop {
      0%, 100% { transform: translateY(3px) scale(0.96); }
      50% { transform: translateY(5px) scale(0.94); }
    }

    @keyframes floatingHeart {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      50% { transform: translateY(-12px) scale(1.1); opacity: 1; }
      100% { transform: translateY(-24px) scale(0.9); opacity: 0; }
    }

    @keyframes tearDrop {
      0% { transform: translateY(0); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(12px); opacity: 0; }
    }

    @keyframes zzzFloat {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(14px, -18px) scale(1.1); opacity: 0; }
    }

    .anim-happy { animation: happyBounce 2s ease-in-out infinite; }
    .anim-tired { animation: tiredSway 3.5s ease-in-out infinite; }
    .anim-hungry { animation: hungryDream 2.5s ease-in-out infinite; }
    .anim-sad { animation: sadDroop 3s ease-in-out infinite; }
    .anim-cozy { animation: breatheBody 3s ease-in-out infinite; }
    .anim-grumpy { animation: breatheBody 1.4s ease-in-out infinite; }

    /* Парящие микро-эффекты рядом с аватаром */
    .avatar-particle {
      position: absolute;
      pointer-events: none;
      font-size: 14px;
    }

    .particle-heart {
      top: -4px;
      right: -4px;
      animation: floatingHeart 2.2s infinite ease-out;
    }

    .particle-zzz {
      top: -8px;
      right: -2px;
      animation: zzzFloat 2.6s infinite ease-out;
      font-weight: 800;
      color: #89CFF0;
      font-size: 12px;
    }

    .particle-tear {
      bottom: 22px;
      right: 18px;
      width: 5px;
      height: 8px;
      background: #00F2FE;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: tearDrop 2s infinite ease-in;
    }

    .particle-food {
      top: -12px;
      left: -8px;
      font-size: 18px;
      animation: happyBounce 3s infinite ease-in-out;
    }

    /* ===================================================
       1. СТЕКЛЯННЫЙ ВИДЖЕТ ONE UI (НА РАБОЧЕМ СТОЛЕ)
       =================================================== */

    .desktop-wallpaper {
      height: 100%;
      background: linear-gradient(145deg, #182239 0%, #2A173B 50%, #0F172A 100%);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .desktop-clock {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 24px;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .desktop-clock .time {
      font-family: 'Outfit', sans-serif;
      font-size: 52px;
      font-weight: 300;
      letter-spacing: -1.5px;
      line-height: 1;
    }

    .desktop-clock .date {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.85;
      margin-top: 6px;
    }

    /* САМ ВИДЖЕТ LIQUID GLASS */
    .liquid-widget {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.07) 100%);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-radius: 28px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      margin-bottom: 20px;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .liquid-widget:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.4), 0 0 25px var(--primary-glow);
    }

    .widget-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .widget-tag {
      font-size: 11px;
      font-weight: 800;
      color: #FFA39E;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .widget-pulse-dot {
      width: 7px;
      height: 7px;
      background: #00F2FE;
      border-radius: 50%;
      box-shadow: 0 0 8px #00F2FE;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .widget-time-ago {
      font-size: 11px;
      color: #B5B9C8;
      font-weight: 600;
    }

    .widget-body-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .widget-info-col h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.25;
      margin-bottom: 3px;
    }

    .widget-info-col p {
      font-size: 12.5px;
      color: #CFD3E2;
      line-height: 1.35;
    }

    .widget-actions-grid {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-btn {
      flex: 1;
      padding: 9px 8px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.26);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    /* Иконки приложений на рабочем столе */
    .desktop-app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

    // Переключение экранов
    function switchScreen(screen) {
      currentScreen = screen;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick')?.includes(screen));
      if (activeBtn) activeBtn.classList.add('active');

      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      const navMapping = { home: 0, shopping: 1, dinner: 2, passport: 3 };
      if (navMapping[screen] !== undefined) {
        document.querySelectorAll('.nav-item')[navMapping[screen]]?.classList.add('active');
      }

      renderScreen();
      renderDetails();
    }

    function setMoodById(id) {
      const found = moods.find(m => m.id === id);
      if (found) {
        currentMood = found;
        renderScreen();
        renderDetails();
        triggerPush('Жена обновила альтер-эго: ' + found.title);
      }
    }

    function toggleCheck(id) {
      const item = shoppingItems.find(x => x.id === id);
      if (item) {
        item.checked = !item.checked;
        renderScreen();
      }
    }

    function triggerPush(text) {
      const toast = document.getElementById('pushToast');
      document.getElementById('pushBodyText').innerText = text;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 5000);
    }

    function dismissPush(reply) {
      document.getElementById('pushToast').style.display = 'none';
      alert('Ответ отправлен жене: "' + reply + '"');
    }
