name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png paho-mqtt.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.0.6.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "🏡 Уютный Дом v1.0.6 (Иконка приложения, голосование за ужин, редактирование паспорта & кубик/колесо)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Нативное приложение «Уютный Дом» v1.0.6 для двоих

            - 📱 **Фирменная иконка приложения:** Добавлен красивый значок приложения для рабочего стола Android во всех разрешениях (hdpi, xhdpi, xxhdpi, xxxhdpi).
            - ✨ **Только 3D Pixar аватары:** Убран лишний переключатель видов аватаров. Оставлен чистый, премиальный стиль 3D Pixar персонажей с неоновой подсветкой и парящими частицами.
            - 🍲 **«Что на ужин?» — Голосование и рецепты:**
              - Интерактивный опрос для двоих: один предлагает варианты, второй голосует, оба видят выбор в реальном времени!
              - При совпадении выбора — баннер консенсуса с 1-тап кнопкой «🛒 Закинуть продукты в список покупок».
              - База рецептов с возможностью добавлять, редактировать и удалять рецепты.
            - 📋 **Редактирование Паспорта Дома:**
              - Возможность редактировать любую запись (название, значение, заметка, категория) и удалять ненужные.
            - 🎲 **Фиксация результатов в Кубике и Колесе:**
              - 3D кубик и Колесо Фортуны теперь фиксируются на выпавшем результате и больше не сбрасываются в начальное положение. Результат наглядно виден на экране.
            - ⚡ **Надежная синхронизация и мгновенные пуши:**
              - Автоматическое объединение обоих смартфонов в единую комнату по коду `#777888`.
              - Встроенный локальный Paho MQTT клиент без зависимости от внешних CDN.
              - Моментальная доставка SOS-пушей и синхронизация виджета рабочего стола One UI.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Установить**.
          files: |
            build-output/cozy-home-v1.0.6.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
