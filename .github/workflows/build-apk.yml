name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png paho-mqtt.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.0.7.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "🏡 Уютный Дом v1.0.7 (Фоновые пуши 24/7, синхронизация виджета и экрана, рецепты и паспорт)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Нативное приложение «Уютный Дом» v1.0.7 для двоих

            - 🔔 **Фоновые пуши 24/7 (даже при закрытом приложении):** Добавлена нативная фоновая служба Android `CozySyncService`, которая поддерживает постоянную связь с партнером. Системные SOS-пуши, сигналы «Я в магазине» и обновления приходят в шторку уведомлений Android моментально, даже когда приложение полностью закрыто!
            - 🔕 **Убран дублирующий внутренний пуш:** Теперь при получении уведомления приходит строго одно чистое системное уведомление Android.
            - 🔄 **Идеальная синхронизация настроения (экран + виджет):** Исправлено расхождение между главным экраном и виджетом. Настроение партнера обновляется мгновенно в обоих местах, а при открытии приложения данные автоматически подтягиваются из виджета.
            - ⚡ **Стабильная связь без вечных переподключений:** Подключен высокоскоростной защищённый HTTPS/WSS (порт 443) шлюз с автоматическим подключением к семейной комнате `#777888`.
            - 🍝 **Исправлено добавление и редактирование рецептов:** Модальное окно рецептов открывается и сохраняет блюда, время и ингредиенты.
            - 📋 **Исправлено редактирование Паспорта Дома:** Кнопка ✏️ на карточках открывает модальное окно для изменения любых параметров и удаления записей.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Установить**.
          files: |
            build-output/cozy-home-v1.0.7.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
