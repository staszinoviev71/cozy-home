name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.0.5.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "🏡 Уютный Дом v1.0.5 (Раздельные настроения & живое автообновление виджета)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Нативное приложение «Уютный Дом» v1.0.5 для двоих

            - 🎭 **Раздельные независимые настроения:** У каждого партнера теперь свое собственное настроение! Выбор настроения одним партнером больше не сбивает выбор второго. Вы видите свое настроение в блоке выбора и актуальное настроение любимого человека в панели статуса и на виджете.
            - 📲 **Живое автообновление виджета рабочего стола:** Виджет теперь моментально обновляется при изменении настроения партнером, синхронизации и любых изменениях списка покупок (добавление, вычеркивание).
            - 🔔 **Уведомления строго партнеру:** Все SOS-сигналы и оповещения приходят исключительно на телефон партнера.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Установить**.
          files: |
            build-output/cozy-home-v1.0.5.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
