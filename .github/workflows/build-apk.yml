name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png socket.io.min.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.2.2.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "🏡 Уютный Дом v1.2.2 (Динамический 2.5D Домик, Появление Мебели и Безлимитные Искорки)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Обновление «Уютный Дом» v1.2.2: Динамический Дом Мечты

            Большое визуальное обновление раздела «Домик»:
            - 🏠 **Динамический 2.5D дом вместо статичной картинки:**
              - В начале игры дом **пустой** (только стены и деревянный пол студии).
              - Каждый купленный предмет мебели или декора **физически появляется в комнате** на своих координатах с красивой анимацией!
              - 🔥 **Камин** с живым мерцающим пламенем.
              - 🛋️ **Мягкий диван**, на который накидывается вязаный плед.
              - 💡 **Тёплый вечерний торшер**, мягкий коврик, кофемашина, свечи и мисочка.
            - 🏗️ **3 уровня архитектуры:**
              - **Lv. 1 (Студия):** Уютная гостиная с кухней.
              - **Lv. 2 (Мансарда):** Надстраивается второй этаж под скатной крышей, открывается двуспальная кровать и гирлянды тёплых огоньков.
              - **Lv. 3 (Вилла):** Внизу разворачивается зелёная терраса с патио, лавандой и садовым фонариком.
            - ✨ **Сняты лимиты и начислено 5 000 искорок для теста:**
              - Обустраивайте любые комнаты сразу без ожидания недели.
              - Добавлена кнопка быстрой добавки `+1 000 ✨` в хедере домика.
            - 🌙 **День и Вечер:**
              - В вечернем режиме загораются звёзды за окнами, камин, торшер и гирлянды светятся тёплым золотым светом.
            - 🐶 **Живой Коржик:**
              - Дышит, виляет хвостиком и шлёт сердечки при почесывании пузика.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Обновить**.
          files: |
            build-output/cozy-home-v1.2.0.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
