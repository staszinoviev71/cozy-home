name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png socket.io.min.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.2.0.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "🏡 Уютный Дом v1.2.0 (Домик с Коржиком, «Вместе», Заметки и Копилка)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Нативное приложение «Уютный Дом» v1.2.0

            Масштабное обновление приложения для двоих:
            - 🧭 **Новая удобная навигация из 5 разделов:**
              `[ 🏡 Главная ]  [ 🛒 Покупки ]  [ 💖 Вместе ]  [ 🏠 Домик ]  [ 📝 Заметки ]`
            - 🏠 **Вкладка «Домик» (2.5D изометрический Дом Мечты):**
              - Красочный разрез комнат в стилистике Liquid Glass с переключателем **☀️ День / 🌙 Вечер**.
              - Живой любимец **Коржик (Welsh Corgi)** внутри дома: сладко спит у камина, реагирует на поглаживание сердечками.
              - **Лавка уюта:** купленная мебель и декор реально появляются в комнатах (плед на диване, гирлянда, кофемашина, лаванда, свечи, мисочка).
              - Недельный лимит (1–2 предмета в неделю) и уровни расширения дома (Студия ➔ Мансарда ➔ Вилла).
            - 💖 **Вкладка «Вместе»:**
              - 🍝 **Ужин & Меню:** интерактивный опрос на ужин, рецепты и перенос ингредиентов в корзину в 1 клик.
              - 🎁 **Вишлист подарков с режимом сюрприза:** тайно бронируйте подарки для любимого человека — для получателя статус остаётся невидимым до самого вручения!
              - 🎯 **Копилка на мечту:** общие цели накоплений, прогресс-бар и быстрые взносы.
              - 🎡 **Колесо фортуны:** чистый ввод любых своих бытовых вопросов и вариантов без навязанных шаблонов (3D-кубик удалён).
            - 📝 **Вкладка «Заметки»:**
              - Создание своих тематических групп («Домашняя аптечка», «Полезное / Дом», «Счётчик дат», «Контакты мастеров»).
              - Заметки с типом **«Напоминание с датой»** и живым бейджем обратного отсчёта («Осталось 5 дн.», «Завтра!», «Сегодня 🎉»).
              - Быстрое копирование паролей, кодов и дозировок в 1 тап.
            - 🛒 **Вкладка «Покупки»:**
              - Кнопка «Я зашёл в супермаркет (есть 5 минут!)» перенесена наверх списка покупок.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Обновить**.
          files: |
            build-output/cozy-home-v1.2.0.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
