name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png socket.io.min.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.1.1.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "🏡 Уютный Дом v1.1.1 (Новая 3D-иконка и стильные уведомления One UI)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Нативное приложение «Уютный Дом» v1.1.1

            - 🎨 **Новая фирменная 3D-иконка приложения:**
              - Красивый тёплый домик в эстетике 3D Pixar / Apple Liquid Glass.
              - Тёплое сердце в окне, уютный персиково-коралловый градиент и мягкое свечение очага.
              - Нативные круглые и адаптивные версии для экранов Samsung One UI.
            - 🔔 **Улучшенные системные уведомления Android:**
              - Векторная иконка в строке состояния со скруглённым контуром домика и силуэтом сердца.
              - Крупная цветная миниатюра приложения (`LargeIcon`) прямо в карточке пуша.
              - Акцентный персиковый цвет уведомления (#FF8A65).
            - 🚀 **Поддержка постоянного облачного сервера Render.com:**
              - Подключение к `https://cozy-home-sync.onrender.com` для круглосуточной связи без ПК.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Обновить**.
          files: |
            build-output/cozy-home-v1.1.1.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
