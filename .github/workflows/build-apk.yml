name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png paho-mqtt.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.0.8.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "🏡 Уютный Дом v1.0.8 (Мгновенное подключение «В сети», надежный EMQX WSS + нативный MQTT)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Нативное приложение «Уютный Дом» v1.0.8 для двоих

            - 🟢 **Мгновенное подключение «В сети» (устранен оранжевый кружок):**
              - Исправлена ошибка инициализации Paho MQTT: подключение к проверенному WSS-брокеру EMQX (порт 8084) происходит за 1 секунду. Индикатор статуса сразу загорается зелёным: **«В сети #777888»**.
              - Устранена ошибка вызова `initMqtt()` при первом входе через окно онбординга.
            - 🔔 **Нативный SSL MQTT в фоновой службе Android (24/7):**
              - В `CozySyncService` внедрена библиотека Paho Java MQTT с постоянным защищённым каналом `ssl://broker.emqx.io:8883`.
              - Пуши, реакции и изменения настроения доставляются на телефон партнера и на виджет рабочего стола моментально, даже когда приложение закрыто!
            - 🔕 **Строго одно системное уведомление:** Убран дублирующий всплывающий баннер внутри экрана.
            - 📋 **Редактирование Паспорта Дома и Рецептов:** Окна редактирования работают безупречно.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Установить**.
          files: |
            build-output/cozy-home-v1.0.8.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
