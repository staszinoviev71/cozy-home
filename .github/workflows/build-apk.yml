name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png socket.io.min.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.2.1.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "🏡 Уютный Дом v1.2.1 (Исправления Заметок, Редактирование Целей и Сброс Домика)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Обновление «Уютный Дом» v1.2.1

            Быстрый хотфикс и доработки по обратной связи:
            - 🛠️ **Исправлена вкладка «Заметки»:** устранена ошибка инициализации поиска, теперь вкладка моментально и стабильно открывается.
            - 🎨 **Исправлен визуальный баг модальных окон:** заменены сырые шаблонные строки на аккуратные кнопки выбора иконок как в группах заметок, так и в целях.
            - 🎯 **Редактирование общих целей:** добавлена возможность изменить название, целевую сумму, внесённую сумму, иконку или удалить цель в окне редактирования (кнопка `✏️`).
            - 🏡 **Полный сброс прогресса домика:** прогресс сброшен до исходного 1-го уровня (0 искорок, пустые комнаты для нового обустройства). Добавлена кнопка «🔄 Сбросить обустройство домика» в интерфейсе.
            - ✨ **Живое начисление искорок:** теперь за покупку товаров из списка (+5 ✨), взносы в копилку (+15 ✨) и ласку Коржика (+2 ✨) начисляются искорки для обустройства комнат.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Обновить**.
          files: |
            build-output/cozy-home-v1.2.0.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
