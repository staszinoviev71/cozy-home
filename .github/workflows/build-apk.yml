name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png socket.io.min.js android/app/src/main/assets/
          if [ -d "assets" ]; then cp -r assets android/app/src/main/assets/; fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-v1.1.0.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/cozy-home-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozy-home-apk
          path: build-output/cozy-home-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "🏡 Уютный Дом v1.1.0 (Личный сервер Socket.IO + HTTP Long-Polling 24/7)"
          make_latest: "true"
          overwrite: true
          body: |
            ### Нативное приложение «Уютный Дом» v1.1.0 для двоих

            - 🚀 **Личный приватный сервер синхронизации (Node.js + Socket.IO):**
              - Переход с капризных публичных MQTT на свой собственный высокоскоростной сервер.
              - **Socket.IO с технологией умного фолбэка:** соединение мгновенно стартует через HTTP Long-Polling на стандартном порту 443 (HTTPS), а затем переходит в WebSocket. Это пробивает любые сотовые фильтры операторов РФ (МТС, Мегафон, Билайн, Теле2).
              - На сервере подключены только ваши 2 смартфона: 0 спама, 0 задержек, 0 банов.
            - 🔔 **Умная фоновая служба Android (24/7):**
              - Нативная служба `CozySyncService` использует непрерывный HTTP Long-Polling `/api/poll`. Доставка SOS-пушей, сигналов «Я в магазине» и обновлений виджета происходит за доли секунды, даже когда телефон спит или приложение закрыто!
            - 🌐 **Настройка адреса сервера в приложении:**
              - В окне семейной связи добавлено поле для ввода адреса вашего личного сервера на Koyeb / Railway.
            
            **Скачать и установить:**
            1. Нажмите на **`cozy-home-latest.apk`** ниже.
            2. Запустите файл на смартфоне и нажмите **Установить**.
          files: |
            build-output/cozy-home-v1.1.0.apk
            build-output/cozy-home-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
